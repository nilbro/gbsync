[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gbsync"
version = "1.0.0b1"
description = "Sync metrics and fact tables to GrowthBook"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Nilabhra Patra", email = "nlbhrptr@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "jinja2>=3.0.0",
    "growthbook>=1.4.9",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "black>=23.0",
    "mypy>=1.0",
]

[project.scripts]
gbsync = "gbsync.cli:app"

[tool.setuptools]
packages = ["gbsync"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
